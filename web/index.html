<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A1426">
<title>JabCross</title>
<style>
  :root { --ink: #0A1426; --panel: #15233D; --line: #24365A; --sign: #0B5CD5; --amber: #FFC21A;
          --red: #E8382E; --go: #3DDC84; --text: #FFFFFF; --muted: #9DB0D0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); overflow: hidden;
               font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
               -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .cross { display: inline-grid; place-items: center; background: var(--sign); border-radius: 22%; }
  .cross svg { width: 62%; height: 62%; }

  /* Start screen */
  #startBtn { position: fixed; inset: 0; border: 0; background: var(--ink); display: flex; flex-direction: column;
              align-items: center; justify-content: center; gap: 14px; text-align: center;
              padding: env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 40px); }
  #startBtn .cross { width: 92px; height: 92px; margin-bottom: 10px; }
  #startBtn .name { font-size: 54px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  #startBtn .tag { font-size: 19px; color: var(--muted); }
  #startBtn .cta { margin-top: 18vh; background: var(--amber); color: var(--ink); font-size: 26px; font-weight: 800;
                   padding: 22px 48px; border-radius: 999px; }

  /* Running screen */
  #run { position: fixed; inset: 0; height: 100dvh; display: none; flex-direction: column; gap: 10px;
         padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px); }
  #run.on { display: flex; }
  header { flex: none; display: flex; align-items: center; gap: 8px; height: 36px; }
  header .cross { width: 26px; height: 26px; flex: none; }
  .word { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot.ok { background: var(--go); } #dot.bad { background: var(--red); }
  #where { margin-left: auto; min-width: 0; display: flex; align-items: center; gap: 8px; }
  #loc { font-size: 14px; color: var(--muted); white-space: nowrap; }
  #dest { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
          font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  #infoBtn { width: 32px; height: 32px; flex: none; border-radius: 50%; border: 1px solid var(--line);
             background: transparent; color: var(--muted); font-weight: 700; font-style: italic; font-family: Georgia, serif; }
  #loc:empty, #dest:empty { display: none; }

  #card { flex: none; display: flex; align-items: center; gap: 14px; min-height: 112px; padding: 14px 16px;
          background: var(--sign); border-radius: 20px; transition: background .2s; }
  #card.warn { background: #B86E00; } #card.stop { background: var(--red); }
  #arrow { width: 62px; height: 62px; flex: none; border-radius: 14px; background: rgba(255,255,255,.16);
           display: grid; place-items: center; }
  #arrow svg { width: 40px; height: 40px; transition: transform .25s; }
  #arrow[data-dir="left"] svg { transform: rotate(-90deg); } #arrow[data-dir="right"] svg { transform: rotate(90deg); }
  #arrow .stopIcon, #arrow[data-dir="stop"] .arrowIcon { display: none; }
  #arrow[data-dir="stop"] .stopIcon { display: block; }
  #line { margin: 0; font-size: 28px; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #line.long { font-size: 22px; }

  #views { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .view { position: relative; overflow: hidden; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
  .view video, .view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .view img { display: none; }
  .view .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; padding: 12px; text-align: center; }
  .view .lbl { position: absolute; left: 8px; top: 8px; z-index: 1; padding: 3px 9px; border-radius: 999px;
               background: rgba(10,20,38,.72); font-size: 12px; font-weight: 700; }

  #dock { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #hint { min-height: 22px; max-width: 100%; font-size: 17px; font-weight: 600; color: var(--muted); text-align: center;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint.live { color: var(--amber); }
  #mic { position: relative; width: 124px; height: 124px; border-radius: 50%; border: 0; background: var(--text);
         color: var(--ink); display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(255,255,255,.12); }
  #mic svg { width: 50px; height: 50px; }
  #mic.on { background: var(--amber); box-shadow: 0 0 0 6px rgba(255,194,26,.35); }
  #mic.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 4px solid var(--amber);
                   animation: ring 1.2s ease-out infinite; }
  @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #mic.on::after { animation: none; } }
  @media (max-height: 700px) { #mic { width: 106px; height: 106px; } #card { min-height: 96px; } #line { font-size: 25px; } #line.long { font-size: 20px; } }
  #typed { display: flex; gap: 8px; width: 100%; }
  #typed[hidden] { display: none; }
  #typed input { flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
                 background: var(--panel); color: var(--text); }
  #typed button { padding: 10px 16px; border-radius: 12px; border: 0; background: var(--sign); font-weight: 700; }

  #dbg { position: absolute; top: calc(env(safe-area-inset-top) + 190px); right: 12px; z-index: 5; width: min(300px, calc(100% - 24px));
         padding: 10px 12px; border-radius: 14px; background: rgba(10,20,38,.94); border: 1px solid var(--line);
         font: 12px/1.45 ui-monospace, Menlo, monospace; color: #CFE0FF; }
  #dbg[hidden] { display: none; }
  #dbgText { white-space: pre-wrap; word-break: break-word; margin: 0 0 8px; font: inherit; }
  #srcBtn { font: inherit; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
</style>
</head>
<body>
<button id="startBtn" aria-label="Start JabCross indoor navigation. Turns on camera, motion, microphone and speech.">
  <span class="cross" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#fff" d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg></span>
  <span class="name">JabCross</span>
  <span class="tag">Indoor navigation for hospitals</span>
  <span class="cta">Tap to start</span>
</button>

<div id="run">
  <header>
    <span class="cross" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#fff" d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg></span>
    <span class="word">JabCross</span>
    <span id="dot" aria-hidden="true"></span>
    <div id="where"><span id="loc"></span><span id="dest"></span>
      <button id="infoBtn" aria-label="Show debug info" aria-expanded="false">i</button></div>
  </header>

  <div id="card">
    <div id="arrow" aria-hidden="true">
      <svg class="arrowIcon" viewBox="0 0 24 24"><path fill="#fff" d="M12 2l8 9h-5v11H9V11H4z"/></svg>
      <svg class="stopIcon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="#fff"/></svg>
    </div>
    <p id="line">Where would you like to go?</p>
  </div>

  <div id="views">
    <div class="view"><span class="lbl">Camera</span><div class="ph" id="camPh">Starting camera…</div><video id="video" playsinline muted autoplay></video></div>
    <div class="view"><span class="lbl">Depth</span><div class="ph">Waiting for depth</div><img id="depthImg" alt=""></div>
  </div>

  <div id="dock">
    <div id="hint">Tap the mic and say a destination</div>
    <div id="typed" hidden><input id="cmdInput" placeholder="Type a destination"><button id="cmdSend">Go</button></div>
    <button id="mic" aria-label="Talk. Tap and say where you want to go.">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
    </button>
  </div>

  <div id="dbg" hidden><pre id="dbgText"></pre><button id="srcBtn">src: compass</button></div>
</div>
<canvas id="canvas" hidden></canvas>

<script>
// ---- Tunables -------------------------------------------------------------
const MIN_FRAME_MS = 300;
const DEPTH_REFRESH_MS = 700;  // how often the depth view reloads /depth.jpg
const FRAME_WIDTH = 640;
const LISTEN_MAX_MS = 10000;   // safety: iOS recognition sometimes never fires onend
// Gyro fallback. Phone upright on chest, camera forward: turning the body rotates
// about the phone's long (Y) axis. W3C: rotationRate.alpha = around Z, beta = around X,
// gamma = around Y. Right-hand rule with Y pointing up => a right (clockwise from above)
// turn gives a NEGATIVE rate, so -1 makes heading increase on a right turn.
// If the gyro value moves the wrong way, flip GYRO_SIGN. If it doesn't move at all when
// turning, watch the raw "rr a/b/g" debug values and set GYRO_AXIS to the one that moves.
const GYRO_SIGN = -1;
const GYRO_AXIS = 'gamma';

// ---- DOM / state ----------------------------------------------------------
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const IDLE_HINT = SR ? 'Tap the mic and say a destination' : 'Type a destination below';

let started = false, navigating = false, audioCtx = null, wakeLock = null;
let compass = null, gyro = 0, lastMotionT = null, rawRate = '-', headingSrc = 'compass';
let rtt = '-', lastFrameOk = 0, lastTranscript = '-', lastErr = '-';
let speaking = false, pending = null, pendingUrgent = false, curUtt = null, safetyTimer = null;
let rec = null, listening = false, recTimer = null, alertTimer = null;

function showErr(msg) { lastErr = String(msg); console.warn(msg); }
function setHint(text, live = false) { $('hint').textContent = text; $('hint').classList.toggle('live', live); }

// ---- Instruction card -----------------------------------------------------
function showLine(text) {
  $('line').textContent = text;
  $('line').classList.toggle('long', text.length > 44);
  const dir = /\bstop\b|obstacle|blocked/i.test(text) ? 'stop' : /\bleft\b/i.test(text) ? 'left'
            : /\bright\b/i.test(text) ? 'right' : 'up';
  $('arrow').dataset.dir = dir;
}
function flashAlert(kind) {
  $('card').className = kind;
  clearTimeout(alertTimer);
  alertTimer = setTimeout(() => { $('card').className = ''; }, 2500);
}

// ---- Speech out -----------------------------------------------------------
// While the mic is listening nothing is spoken: the newest line waits in `pending`.
function say(text, urgent = false) {
  showLine(text);
  if (listening) {                            // don't let routine guidance replace a held stop line
    if (urgent || !pendingUrgent) { pending = text; pendingUrgent = urgent; }
    return;
  }
  if (urgent) { hush(); speakNow(text); return; }
  if (speaking) { pending = text; return; }   // one slot, newest wins
  speakNow(text);
}

function speakNow(text) {
  speaking = true;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.onend = u.onerror = () => { if (curUtt === u) speechDone(); };
  curUtt = u;
  clearTimeout(safetyTimer);                  // iOS sometimes never fires onend
  safetyTimer = setTimeout(() => { if (curUtt === u) speechDone(); }, text.length * 80 + 2000);
  speechSynthesis.speak(u);
}

function speechDone() {
  clearTimeout(safetyTimer);
  curUtt = null; speaking = false;
  flushPending();
}

function flushPending() {
  if (pending && !speaking && !listening) { const t = pending; pending = null; pendingUrgent = false; speakNow(t); }
}

function hush() {
  curUtt = null; pending = null; pendingUrgent = false; speaking = false;
  clearTimeout(safetyTimer);
  speechSynthesis.cancel();
}

// ---- Tones ----------------------------------------------------------------
function beep(freq, durS, atS) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.4, atS);
  g.gain.setValueAtTime(0, atS + durS);
  o.connect(g).connect(audioCtx.destination);
  o.start(atS); o.stop(atS + durS + 0.02);
}

function tone(kind) {
  flashAlert(kind);
  if (!audioCtx) return;
  if (audioCtx.state !== 'running') audioCtx.resume();
  const t = audioCtx.currentTime + 0.02;
  if (kind === 'warn') beep(880, 0.15, t);
  if (kind === 'stop') for (let i = 0; i < 3; i++) beep(1400, 0.1, t + i * 0.18);
}

// ---- Heading --------------------------------------------------------------
addEventListener('deviceorientation', e => {
  if (e.webkitCompassHeading != null) compass = e.webkitCompassHeading;   // iOS, clockwise
  else if (e.alpha != null) compass = (360 - e.alpha) % 360;             // alpha is CCW
});

addEventListener('devicemotion', e => {
  const r = e.rotationRate, now = performance.now();
  if (r && r[GYRO_AXIS] != null) {
    if (lastMotionT != null) {
      const dt = Math.min((now - lastMotionT) / 1000, 0.2);              // ignore long gaps
      gyro = ((gyro + GYRO_SIGN * r[GYRO_AXIS] * dt) % 360 + 360) % 360;
    }
    rawRate = [r.alpha, r.beta, r.gamma].map(v => (v ?? 0).toFixed(0)).join('/');
  }
  lastMotionT = now;
});

function currentHeading() {
  return headingSrc === 'compass' && compass != null ? compass : gyro;
}

// ---- Depth view (server's latest colorized depth) --------------------------
const depthImg = $('depthImg');
let depthBusy = false, depthAt = 0;
depthImg.onload = () => { depthBusy = false; depthImg.style.display = 'block'; };
depthImg.onerror = () => { depthBusy = false; };   // e.g. mock server has no /depth.jpg
function refreshDepth() {
  if (depthBusy || performance.now() - depthAt < DEPTH_REFRESH_MS) return;
  depthBusy = true; depthAt = performance.now();
  depthImg.src = '/depth.jpg?t=' + Date.now();
}

// ---- Frame loop -----------------------------------------------------------
async function frameLoop() {
  for (;;) {
    const t0 = performance.now();
    try {
      if (!video.videoWidth) { await sleep(MIN_FRAME_MS); continue; }
      const h = Math.round(video.videoHeight * FRAME_WIDTH / video.videoWidth);
      if (canvas.width !== FRAME_WIDTH || canvas.height !== h) { canvas.width = FRAME_WIDTH; canvas.height = h; }
      ctx.drawImage(video, 0, 0, FRAME_WIDTH, h);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
      const fd = new FormData();
      fd.append('image', blob, 'frame.jpg');
      fd.append('heading', currentHeading().toFixed(1));
      const opts = { method: 'POST', body: fd };
      if (AbortSignal.timeout) opts.signal = AbortSignal.timeout(8000);   // don't hang forever on a dead tunnel
      const res = await fetch('/frame', opts);
      if (!res.ok) throw new Error('frame HTTP ' + res.status);
      const j = await res.json();
      rtt = Math.round(performance.now() - t0); lastFrameOk = performance.now();
      refreshDepth();
      if (j.alert === 'warn' || j.alert === 'stop') tone(j.alert);
      // Before the first command, only stop alerts may talk, so the opening question isn't clobbered.
      if (j.speak && (navigating || j.alert === 'stop')) say(j.speak, j.alert === 'stop');
      await sleep(Math.max(0, MIN_FRAME_MS - (performance.now() - t0)));
    } catch (e) {
      showErr('frame: ' + e.message);
      await sleep(1000);
    }
  }
}

// ---- Voice in (push-to-talk only) -----------------------------------------
async function sendCommand(text) {
  lastTranscript = text;
  setHint('“' + text + '”');
  try {
    const res = await fetch('/command', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }),
    });
    const j = await res.json();
    navigating = true;
    if (j.speak) say(j.speak);
  } catch (e) { showErr('command: ' + e.message); setHint('Could not reach the server. Try again.'); }
}

function startListening() {
  const r = new SR();                          // fresh instance each time; reuse is flaky on iOS
  r.lang = 'en-US'; r.interimResults = true; r.continuous = false;
  let finalText = '', heard = '', sent = false, blocked = false;
  r.onresult = e => {
    if (rec !== r) return;
    let words = '';
    for (const res of e.results) { words += res[0].transcript; if (res.isFinal) finalText = words.trim(); }
    heard = words.trim();
    if (heard) setHint(heard, true);
  };
  r.onerror = e => {
    if (rec !== r) return;
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    showErr('rec: ' + e.error);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') blocked = true;
  };
  r.onend = () => {
    if (rec !== r) return;                     // aborted by the user; stopListening already reset
    const text = blocked ? '' : finalText || heard;
    if (text && !pendingUrgent) pending = null;  // the command reply supersedes held guidance
    endListening();
    if (blocked) setHint('Microphone blocked. Allow it in Settings.');
    // iOS sometimes ends without marking a result final; on a natural end the last words are the final ones.
    else if (text && !sent) { sent = true; sendCommand(text); }
  };
  rec = r; listening = true;
  $('mic').classList.add('on'); setHint('Listening…', true);
  clearTimeout(recTimer);
  recTimer = setTimeout(() => {                // ask for a final result; force-reset if onend never comes
    try { r.stop(); } catch (e) {}
    recTimer = setTimeout(stopListening, 1500);
  }, LISTEN_MAX_MS);
  try { r.start(); } catch (e) { showErr('rec start: ' + e.message); endListening(); }
}

function endListening() {
  clearTimeout(recTimer);
  rec = null; listening = false;
  $('mic').classList.remove('on'); setHint(IDLE_HINT);
  flushPending();
}

function stopListening() {
  const r = rec;
  endListening();
  try { r && r.abort(); } catch (e) {}
}

$('mic').addEventListener('click', () => {
  if (!SR) { $('cmdInput').focus(); return; }
  if (listening) { stopListening(); return; }
  hush(); startListening();
});
$('srcBtn').addEventListener('click', () => {
  headingSrc = headingSrc === 'compass' ? 'gyro' : 'compass';
  $('srcBtn').textContent = 'src: ' + headingSrc;
});
$('infoBtn').addEventListener('click', () => {
  const open = $('dbg').hidden;
  $('dbg').hidden = !open;
  $('infoBtn').setAttribute('aria-expanded', open);
});
function sendTyped() {
  const t = $('cmdInput').value.trim();
  if (t) { $('cmdInput').value = ''; sendCommand(t); }
}
$('cmdSend').addEventListener('click', sendTyped);
$('cmdInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendTyped(); });

// ---- Navigator state (location + destination) -----------------------------
const placeName = id => id === 'xray' ? 'X-ray' : String(id).replace(/[_-]/g, ' ').replace(/^./, c => c.toUpperCase());
let stateBusy = false;
async function pollState() {
  if (stateBusy) return;
  stateBusy = true;
  try {
    const res = await fetch('/state', AbortSignal.timeout ? { signal: AbortSignal.timeout(3000) } : {});
    if (res.ok) {
      const s = await res.json();
      $('loc').textContent = s.node ? 'At ' + placeName(s.node) : '';
      $('dest').textContent = s.destination ? '→ ' + placeName(s.destination) : '';
    }
  } catch (e) {                                // mock server has no /state
  } finally { stateBusy = false; }
}

// ---- Wake lock ------------------------------------------------------------
async function getWakeLock() {
  if (!('wakeLock' in navigator)) { showErr('no wakeLock API'); return; }
  try { wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { showErr('wakeLock: ' + e.message); }
}
document.addEventListener('visibilitychange', () => {
  if (started && document.visibilityState === 'visible') getWakeLock();
});

// ---- Start (single user gesture unlocks everything) -----------------------
$('startBtn').addEventListener('click', () => {
  // Everything gated by iOS gesture rules is called synchronously here, before any await.
  say('Starting');
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    const s = audioCtx.createBufferSource();   // silent buffer: extra iOS unlock
    s.buffer = audioCtx.createBuffer(1, 1, 22050);
    s.connect(audioCtx.destination); s.start();
  } catch (e) { showErr('audio: ' + e.message); }
  const perms = [];
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
    perms.push(DeviceOrientationEvent.requestPermission());
  if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function')
    perms.push(DeviceMotionEvent.requestPermission());
  const cam = navigator.mediaDevices && navigator.mediaDevices.getUserMedia
    ? navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    : Promise.reject(new Error('getUserMedia unavailable (needs HTTPS)'));
  getWakeLock();
  finishStart(cam, perms);
});

async function finishStart(cam, perms) {
  started = true;
  $('startBtn').style.display = 'none';
  $('run').classList.add('on');
  setHint(IDLE_HINT);
  if (!SR) $('typed').hidden = false;
  pollState(); setInterval(pollState, 1000);
  for (const p of await Promise.allSettled(perms)) {
    if (p.status === 'rejected') showErr('motion perm: ' + p.reason);
    else if (p.value !== 'granted') showErr('motion perm: ' + p.value);
  }
  let camOk = false;
  try {
    video.srcObject = await cam;
    await video.play();
    camOk = true;
    $('camPh').hidden = true;
  } catch (e) {
    showErr('camera: ' + e.name + ' ' + e.message);
    $('camPh').textContent = 'Camera unavailable';
    say('Camera failed. ' + e.name, true);
  }
  say('Where would you like to go?');
  if (camOk) frameLoop();
}

// ---- Status dot + debug overlay -------------------------------------------
setInterval(() => {
  if (!started) return;
  $('dot').className = !lastFrameOk ? '' : performance.now() - lastFrameOk < 3000 ? 'ok' : 'bad';
  if ($('dbg').hidden) return;
  const f = v => v == null ? '-' : v.toFixed(0);
  $('dbgText').textContent =
    `hdg compass ${f(compass)}  gyro ${f(gyro)}\n` +
    `sent ${headingSrc === 'compass' && compass != null ? 'compass' : 'gyro'}  rr a/b/g ${rawRate}\n` +
    `rtt ${rtt} ms  ${speaking ? 'speaking' : ''} ${listening ? 'listening' : ''}\n` +
    `heard: ${lastTranscript}\n` +
    `err: ${lastErr}`;
}, 250);
</script>
</body>
</html>
